name: mario
description: "Mario — your notes, your world."
publish_to: 'none'
version: 1.2.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / DI / routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  get_it: ^7.7.0

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.0
  firebase_storage: ^12.1.0

  # Google APIs
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_fonts: ^6.2.1

  # Editor
  appflowy_editor: ^3.2.0

  # Math
  flutter_math_fork: ^0.7.2
  math_expressions: ^2.6.0

  # Drawing
  perfect_freehand: ^2.0.2

  # Spreadsheet
  excel: ^4.0.3

  # Voice
  speech_to_text: ^7.0.0
  record: ^6.0.0
  just_audio: ^0.9.39

  # Storage / local
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^10.0.0

  # AI (Anthropic API)
  http: ^1.2.2

  # Content-addressing for synced image assets (see AssetSyncService) — the
  # sha-256 of an image's bytes is what stops the same picture uploading twice.
  crypto: ^3.0.3

  # Used directly by custom AppFlowy block components
  provider: ^6.1.2

  # Syntax highlighting for the IDE-style code block (pure-Dart highlight.js
  # port; the same engine AppFlowy itself uses). Ships languages + themes.
  re_highlight: ^0.0.3

  # UI / system
  # Waiting indicator — see lib/ui/widgets/mario_loader.dart, which fixes the
  # colour and the minimum legible size in one place.
  loading_animation_widget: ^1.3.0
  window_manager: ^0.3.9
  tray_manager: ^0.5.0
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  pdf: ^3.11.1
  intl: ^0.19.0
  flutter_markdown: ^0.7.3
  firedart: ^0.9.8
  pasteboard: ^0.4.0
  desktop_drop: ^0.7.1

  # HTML preview pane — embedded Chromium via CEF. Linux/Win/macOS desktop
  # only; first build downloads ~150MB of CEF binaries.
  webview_cef: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

  # Lets asset_cache_test drive the real AssetCache against a temp directory by
  # swapping PathProviderPlatform.instance — its bugs live in the interaction
  # between the in-memory index and the actual files, which a double can't show.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# Vendored + patched: Flutter 3.44 added TextInputClient.onFocusReceived and
# neither package implements it yet (checked through appflowy_editor 6.2.0).
# Each copy carries a one-method override; see the "Mario patch" comment in
# third_party/*/lib/**. Drop these once upstream ships the fix.
dependency_overrides:
  appflowy_editor:
    path: third_party/appflowy_editor
  webview_cef:
    path: third_party/webview_cef

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    # Bundled for PDF export only (loaded via rootBundle by the `pdf` package).
    # Noto Sans gives broad Unicode coverage so non-Latin characters no longer
    # render as missing-glyph boxes; the symbol/math faces are fallbacks.
    - assets/fonts/
